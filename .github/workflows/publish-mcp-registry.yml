name: Publish Arfiti to the MCP Registry
on:
  push:
    tags:
      - 'mcp-registry-v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Check release version and install the official publisher
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "mcp-registry-v$(jq -r .version server.json)"
          archive=mcp-publisher_linux_amd64.tar.gz
          curl --fail --location --retry 3 -o "$RUNNER_TEMP/$archive" \
            "https://github.com/modelcontextprotocol/registry/releases/download/v1.8.16/$archive"
          echo "6e2f799550cf843c6fd3350498d56cc49be3dc0af1e6237eb0e6435c7a9d5c05  $RUNNER_TEMP/$archive" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" mcp-publisher
      - name: Validate and publish under the Arfiti organization
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/mcp-publisher" validate
          "$RUNNER_TEMP/mcp-publisher" login github-oidc
          "$RUNNER_TEMP/mcp-publisher" publish
